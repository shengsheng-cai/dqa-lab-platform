name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: cd client && npm ci
      - run: cd client && npm run lint
      - run: ruff check backend/
      - run: cd backend && python -m pytest
      - run: cd client && npm test

  e2e:
    runs-on: ubuntu-latest
    # 分兩片跑。這不違反「E2E 不平行跑」那條規則：那條擋的是同一個後端底下開多個 worker，
    # 而每一片是各自的 runner、各自的後端與資料庫，彼此看不到對方。
    # 再多切一片省不到多少——每片都要重付一次安裝與前端 build 的固定成本。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/e2e/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: cd client && npm ci
      - run: cd tests/e2e && npm ci
      # 瀏覽器本體每次重抓要 20 幾秒。key 綁 lock file，Playwright 版本一升就自動換一份快取，
      # 不會拿舊瀏覽器配新版函式庫。--with-deps 的 apt 那段快取不了，仍然每次跑。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - run: cd tests/e2e && npx playwright install --with-deps chromium
      - run: make test-e2e ARGS="--shard=${{ matrix.shard }}/2"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          # 名稱要帶片號，兩片同時失敗會撞名
          name: e2e-failure-report-shard${{ matrix.shard }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/.backend.log
          retention-days: 7
