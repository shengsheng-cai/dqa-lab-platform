name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: cd client && npm ci
      - run: cd client && npm run lint
      - run: ruff check backend/
      - run: cd backend && python -m pytest
      - run: cd client && npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/e2e/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: cd client && npm ci
      - run: cd tests/e2e && npm ci
      # 瀏覽器本體每次重抓要 20 幾秒。key 綁 lock file，Playwright 版本一升就自動換一份快取，
      # 不會拿舊瀏覽器配新版函式庫。--with-deps 的 apt 那段快取不了，仍然每次跑。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - run: cd tests/e2e && npx playwright install --with-deps chromium
      - run: make test-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/.backend.log
          retention-days: 7
